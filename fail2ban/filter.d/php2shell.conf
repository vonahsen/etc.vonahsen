[Definition]
# Matches common scanning tools and generic web shell script drops post-exploit
failregex = ^<HOST> -.*"POST .*HTTP/.*" (400|413)
            ^<HOST> -.*"GET .*(\.php\?|php2shell|upload_progress_).* HTTP/.*" 404
            ^<HOST> -.*"(GET|POST) .*\/wp-admin\/.*" 403

# (400|413) originally included |500 - that's a _bit_ aggressive
# and if you're dumb enough to put the 'sploit name IN your attempt, that's on you
