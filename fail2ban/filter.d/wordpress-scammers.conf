# Fail2Ban wordpress-scammers filter
#

[INCLUDES]

[Definition]

# Mode for filter: normal (default) and aggressive (allows DDoS & brute force detection of mod_evasive)
mode = normal

failregex = ^<HOST> - - .* "GET /wp-(admin|includes).*HTTP/1.[0,1]" 40\d .*$
	^<HOST> - - .* "GET /wp-(admin|includes).*HTTP/1.[0,1]" 50\d .*$

ignoreregex = 

# DEV Notes:
#
# almost anyone going straight at wp-admin or wp-includes files is no good, log 400 and 500 codes
